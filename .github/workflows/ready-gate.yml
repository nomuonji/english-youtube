name: READY gate

on:
  push:
    branches: [main]
    paths:
      - "runs/**/READY.json"

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  synthesize:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    outputs:
      episode_id: ${{ steps.ready.outputs.episode_id }}
      manifest_hash: ${{ steps.ready.outputs.manifest_hash }}
    steps:
      - name: Checkout exact READY commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Find READY marker in head commit
        id: ready
        shell: bash
        run: |
          set -euo pipefail
          path="$(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" | grep -E '^runs/[0-9]{4}-[0-9]{2}-[0-9]{2}/[^/]+/READY\.json$' | head -n 1 || true)"
          if [ -z "$path" ]; then
            echo "No READY.json added in head commit" >&2
            exit 2
          fi
          episode_id="$(node -e 'const fs=require("fs"); const r=JSON.parse(fs.readFileSync(process.argv[1],"utf8")); process.stdout.write(r.episodeId)' "$path")"
          manifest_hash="$(node -e 'const fs=require("fs"); const r=JSON.parse(fs.readFileSync(process.argv[1],"utf8")); process.stdout.write(r.manifestHash)' "$path")"
          if ! [[ "$episode_id" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "Unsafe episodeId in READY.json" >&2
            exit 2
          fi
          if ! [[ "$manifest_hash" =~ ^[0-9a-f]{64}$ ]]; then
            echo "Unsafe manifestHash in READY.json" >&2
            exit 2
          fi
          echo "path=$path" >> "$GITHUB_OUTPUT"
          echo "episode_id=$episode_id" >> "$GITHUB_OUTPUT"
          echo "manifest_hash=$manifest_hash" >> "$GITHUB_OUTPUT"
          echo "manifest=episodes/$episode_id/manifest.json" >> "$GITHUB_OUTPUT"
      - name: Validate READY and manifest hash
        run: npm run check-ready -- "${{ steps.ready.outputs.path }}"
      - name: Retention review production manifest
        run: npm run review:retention -- "${{ steps.ready.outputs.manifest }}"
      - name: Cognitive-load review production manifest
        run: npm run review:cognitive -- "${{ steps.ready.outputs.manifest }}"
      - name: Install local Kokoro TTS runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq espeak-ng
          python3 -m pip install --disable-pip-version-check -r requirements-tts.txt
      - name: Cache Kokoro model
        id: kokoro-model-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/kokoro
          key: kokoro-model-v1.1-int8-${{ runner.os }}
      - name: Download Kokoro int8 model
        if: steps.kokoro-model-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .cache/kokoro
          curl -fL --retry 3 --retry-delay 2 \
            -o .cache/kokoro/kokoro-v1.0.int8.onnx \
            https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/kokoro-v1.0.int8.onnx
          curl -fL --retry 3 --retry-delay 2 \
            -o .cache/kokoro/voices-v1.0.bin \
            https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/voices-v1.0.bin
      - name: Verify Kokoro model assets
        run: |
          test -s .cache/kokoro/kokoro-v1.0.int8.onnx
          test -s .cache/kokoro/voices-v1.0.bin
      - name: Restore Kokoro chunk cache
        id: tts-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/kokoro-chunks
          key: kokoro-chunks-v2-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            kokoro-chunks-v2-${{ runner.os }}-
            kokoro-chunks-v1-${{ runner.os }}-
      - name: Synthesize local speech with exact chunk sample boundaries
        env:
          KOKORO_VOICE: af_sarah
          KOKORO_SPEED: "0.95"
          KOKORO_MODEL_PATH: .cache/kokoro/kokoro-v1.0.int8.onnx
          KOKORO_VOICES_PATH: .cache/kokoro/voices-v1.0.bin
          KOKORO_CHUNK_CACHE_DIR: .cache/kokoro-chunks
        run: |
          mkdir -p public/generated
          python3 scripts/synthesize_kokoro.py "${{ steps.ready.outputs.manifest }}" public/generated generated
      - name: Save expanded Kokoro chunk cache
        if: steps.tts-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/kokoro-chunks
          key: kokoro-chunks-v2-${{ runner.os }}-${{ github.sha }}
      - name: Restore editorial image cache
        id: editorial-image-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: public/generated/images
          key: editorial-images-v1-${{ runner.os }}-${{ steps.ready.outputs.manifest_hash }}
      - name: Build editorial image briefs
        run: node scripts/build_image_briefs.mjs "${{ steps.ready.outputs.manifest }}" public/generated/image-briefs.json
      - name: Generate optional editorial images with Cloudflare FLUX
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/generate_cloudflare_images.mjs public/generated/image-briefs.json public/generated/images
      - name: Save editorial image cache
        if: steps.editorial-image-cache.outputs.cache-hit != 'true' && hashFiles('public/generated/images/*.jpg') != ''
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: public/generated/images
          key: editorial-images-v1-${{ runner.os }}-${{ steps.ready.outputs.manifest_hash }}
      - name: Compile resolved timing
        run: npm run compile:tts -- "${{ steps.ready.outputs.manifest }}" public/generated/tts-timing.json public/generated/render-props.json
      - name: Upload speech bundle for render job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ready-tts-${{ steps.ready.outputs.episode_id }}-${{ github.sha }}
          path: public/generated/
          retention-days: 2

  render:
    needs: synthesize
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout exact READY commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Install render fonts and review tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk ffmpeg
      - name: Download synthesized speech bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ready-tts-${{ needs.synthesize.outputs.episode_id }}-${{ github.sha }}
          path: public/generated
      - name: Render 540p preview
        run: |
          mkdir -p out
          npx remotion render src/composition/index.ts EpisodeVideo "out/${{ needs.synthesize.outputs.episode_id }}-preview-540p.mp4" --props=public/generated/render-props.json --scale=0.5 --codec=h264 --crf=23
      - name: Normalize preview narration loudness
        run: bash scripts/normalize_video_audio.sh "out/${{ needs.synthesize.outputs.episode_id }}-preview-540p.mp4"
      - name: Generate 3x3 contact sheet
        shell: bash
        run: |
          set -euo pipefail
          video="out/${{ needs.synthesize.outputs.episode_id }}-preview-540p.mp4"
          sheet="out/${{ needs.synthesize.outputs.episode_id }}-contact-sheet.jpg"
          duration="$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 "$video")"
          interval="$(python3 - <<'PY' "$duration"
          import sys
          duration = max(float(sys.argv[1]), 1.0)
          print(max(duration / 9.0, 0.25))
          PY
          )"
          ffmpeg -hide_banner -loglevel error -y -i "$video" \
            -vf "fps=1/${interval},scale=320:-1,tile=3x3:padding=6:margin=6" \
            -frames:v 1 -q:v 2 "$sheet"
          test -s "$sheet"
      - name: Upload review artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ready-preview-${{ needs.synthesize.outputs.episode_id }}-${{ github.sha }}
          path: |
            out/*-preview-540p.mp4
            out/*-contact-sheet.jpg
            public/generated/tts-timing.json
            public/generated/render-props.json
            public/generated/image-briefs.json
          retention-days: 30
      - name: Publication boundary
        run: |
          echo "READY -> validate -> retention/cognitive review -> local TTS -> optional editorial images -> exact timing -> 540p render -> loudness normalization -> contact sheet passed."
          echo "Publishing is intentionally disabled. A separate APPROVED.json marker is required for a 1080p final render."

  deploy_review:
    needs: [synthesize, render]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}review/
    steps:
      - name: Checkout exact READY commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Build Player site
        run: npm run build
      - name: Download current READY review artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ready-preview-${{ needs.synthesize.outputs.episode_id }}-${{ github.sha }}
          path: review-artifact
      - name: Build browser review page
        run: node scripts/build_review_page.mjs review-artifact dist/review
      - name: Assert review payload
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/review/index.html
          test -s dist/review/video.mp4
          test -s dist/review/contact-sheet.jpg
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
