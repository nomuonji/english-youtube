name: Approved final render

on:
  push:
    branches: [main]
    paths:
      - "runs/**/APPROVED.json"

permissions:
  contents: read

jobs:
  final-render:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout exact approval commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Find APPROVED marker in head commit
        id: approval
        shell: bash
        run: |
          set -euo pipefail
          path="$(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" | grep -E '^runs/[0-9]{4}-[0-9]{2}-[0-9]{2}/[^/]+/APPROVED\.json$' | head -n 1 || true)"
          if [ -z "$path" ]; then
            echo "No APPROVED.json added in head commit" >&2
            exit 2
          fi
          episode_id="$(node -e 'const fs=require("fs"); const r=JSON.parse(fs.readFileSync(process.argv[1],"utf8")); process.stdout.write(r.episodeId)' "$path")"
          manifest_hash="$(node -e 'const fs=require("fs"); const r=JSON.parse(fs.readFileSync(process.argv[1],"utf8")); process.stdout.write(r.manifestHash)' "$path")"
          if ! [[ "$episode_id" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "Unsafe episodeId in APPROVED.json" >&2
            exit 2
          fi
          if ! [[ "$manifest_hash" =~ ^[0-9a-f]{64}$ ]]; then
            echo "Unsafe manifestHash in APPROVED.json" >&2
            exit 2
          fi
          echo "path=$path" >> "$GITHUB_OUTPUT"
          echo "episode_id=$episode_id" >> "$GITHUB_OUTPUT"
          echo "manifest_hash=$manifest_hash" >> "$GITHUB_OUTPUT"
          echo "manifest=episodes/$episode_id/manifest.json" >> "$GITHUB_OUTPUT"
      - name: Validate explicit approval, READY marker, and manifest hash
        run: npm run check-approval -- "${{ steps.approval.outputs.path }}"
      - name: Retention review approved manifest
        run: npm run review:retention -- "${{ steps.approval.outputs.manifest }}"
      - name: Cognitive-load review approved manifest
        run: npm run review:cognitive -- "${{ steps.approval.outputs.manifest }}"
      - name: Install local Kokoro TTS runtime and render tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq espeak-ng fonts-noto-cjk ffmpeg
          python3 -m pip install --disable-pip-version-check -r requirements-tts.txt
      - name: Cache Kokoro model
        id: kokoro-model-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/kokoro
          key: kokoro-model-v1.1-int8-${{ runner.os }}
      - name: Download Kokoro int8 model
        if: steps.kokoro-model-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .cache/kokoro
          curl -fL --retry 3 --retry-delay 2 \
            -o .cache/kokoro/kokoro-v1.0.int8.onnx \
            https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/kokoro-v1.0.int8.onnx
          curl -fL --retry 3 --retry-delay 2 \
            -o .cache/kokoro/voices-v1.0.bin \
            https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/voices-v1.0.bin
      - name: Verify Kokoro model assets
        run: |
          test -s .cache/kokoro/kokoro-v1.0.int8.onnx
          test -s .cache/kokoro/voices-v1.0.bin
      - name: Restore Kokoro chunk cache
        id: tts-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/kokoro-chunks
          key: kokoro-chunks-v2-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            kokoro-chunks-v2-${{ runner.os }}-
            kokoro-chunks-v1-${{ runner.os }}-
      - name: Synthesize approved speech
        env:
          KOKORO_VOICE: af_sarah
          KOKORO_SPEED: "0.95"
          KOKORO_MODEL_PATH: .cache/kokoro/kokoro-v1.0.int8.onnx
          KOKORO_VOICES_PATH: .cache/kokoro/voices-v1.0.bin
          KOKORO_CHUNK_CACHE_DIR: .cache/kokoro-chunks
        run: |
          mkdir -p public/generated out
          python3 scripts/synthesize_kokoro.py "${{ steps.approval.outputs.manifest }}" public/generated generated
      - name: Save Kokoro chunk cache
        if: steps.tts-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/kokoro-chunks
          key: kokoro-chunks-v2-${{ runner.os }}-${{ github.sha }}
      - name: Restore reviewed editorial images
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: public/generated/images
          key: editorial-images-v2-${{ runner.os }}-${{ steps.approval.outputs.manifest_hash }}
      - name: Restore reviewed B-roll
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: public/generated/broll
          key: reviewed-broll-v1-${{ runner.os }}-${{ steps.approval.outputs.manifest_hash }}
      - name: Require reviewed B-roll manifest
        run: test -s public/generated/broll/manifest.json
      - name: Compile resolved timing with frozen review assets
        env:
          ALLOW_BROLL_FETCH: "false"
        run: npm run compile:tts -- "${{ steps.approval.outputs.manifest }}" public/generated/tts-timing.json public/generated/render-props.json
      - name: Generate reviewed background music bed
        run: python3 scripts/generate_bgm.py public/generated/render-props.json public/generated/bgm.wav
      - name: Render approved 1080p final
        run: npx remotion render src/composition/index.ts EpisodeVideo "out/${{ steps.approval.outputs.episode_id }}-final-1080p.mp4" --props=public/generated/render-props.json --codec=h264 --crf=18
      - name: Normalize final narration loudness
        run: bash scripts/normalize_video_audio.sh "out/${{ steps.approval.outputs.episode_id }}-final-1080p.mp4"
      - name: Upload approved final artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: approved-final-${{ steps.approval.outputs.episode_id }}-${{ github.sha }}
          path: |
            out/*-final-1080p.mp4
            public/generated/tts-timing.json
            public/generated/render-props.json
            public/generated/broll/manifest.json
            ${{ steps.approval.outputs.path }}
          retention-days: 14
      - name: Publishing boundary
        run: |
          echo "Explicit approval -> retention/cognitive review -> reviewed image/B-roll restore -> deterministic BGM/SFX -> 1080p final render -> loudness normalization passed."
          echo "YouTube upload remains disabled until the publishing adapter is implemented and separately gated."
