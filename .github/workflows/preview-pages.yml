name: Preview Pages

# Deploys the Remotion Player, production READY review at /review/,
# and the current PR #2 v3 experiment at /review-v3/ without merging v3.
on:
  push:
    branches: [main]
    paths:
      - "src/preview/**"
      - "src/scenes/**"
      - "src/composition/**"
      - "src/fixtures/**"
      - "fixtures/**"
      - "config/**"
      - "scripts/build_review_page.mjs"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - "index.html"
      - ".github/workflows/preview-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pull-requests: read
  pages: write
  id-token: write

concurrency:
  group: "pages-deploy"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Validate fixture
        run: npm run validate -- fixtures/v2.1-demo.json
      - name: Build Player site
        run: npm run build
      - name: Include latest READY review when available
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          run_id="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ready-gate.yml/runs?status=success&per_page=10" --jq '.workflow_runs[0].id // empty')"
          if [ -z "$run_id" ]; then
            echo "No successful READY run yet; deploying Player without /review/."
            exit 0
          fi
          artifact_name="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/artifacts?per_page=100" --jq '.artifacts[] | select(.expired == false and (.name | startswith("ready-preview-"))) | .name' | head -n 1 || true)"
          if [ -z "$artifact_name" ]; then
            echo "Latest successful READY run has no live review artifact; preserving Player only."
            exit 0
          fi
          rm -rf review-artifact
          mkdir -p review-artifact
          gh run download "$run_id" --repo "$GITHUB_REPOSITORY" --name "$artifact_name" --dir review-artifact
          node scripts/build_review_page.mjs review-artifact dist/review
      - name: Include current PR v3 review when available
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          pr_number="2"
          head_sha="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${pr_number}" --jq '.head.sha // empty' 2>/dev/null || true)"
          if [ -z "$head_sha" ]; then
            echo "PR #${pr_number} is unavailable; deploying without /review-v3/."
            exit 0
          fi
          run_id="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/v3-preview.yml/runs?event=pull_request&status=success&head_sha=${head_sha}&per_page=10" --jq '.workflow_runs[0].id // empty')"
          if [ -z "$run_id" ]; then
            echo "No successful v3 preview for current PR head ${head_sha}; deploying without /review-v3/."
            exit 0
          fi
          artifact_name="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/artifacts?per_page=100" --jq '.artifacts[] | select(.expired == false and (.name | startswith("ai-power-v3-english-preview-"))) | .name' | head -n 1 || true)"
          if [ -z "$artifact_name" ]; then
            echo "Current v3 run has no live preview artifact; deploying without /review-v3/."
            exit 0
          fi
          rm -rf v3-review-artifact
          mkdir -p v3-review-artifact
          gh run download "$run_id" --repo "$GITHUB_REPOSITORY" --name "$artifact_name" --dir v3-review-artifact
          node scripts/build_review_page.mjs v3-review-artifact dist/review-v3
      - name: Assert public preview contains no internal run data
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -E 'READY\.json|editorial-review|research\.json' dist --exclude='*.map'; then
            echo "Internal run/research data leaked into Pages output" >&2
            exit 2
          fi
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
