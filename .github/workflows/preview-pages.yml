name: Preview Pages

on:
  push:
    branches: [main]
    paths:
      - "src/preview/**"
      - "src/scenes/**"
      - "src/composition/**"
      - "src/fixtures/**"
      - "fixtures/**"
      - "config/**"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - "index.html"
      - ".github/workflows/preview-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "preview-pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Validate fixture
        run: npm run validate -- fixtures/v2.1-demo.json
      - name: Build Player site
        run: npm run build
      - name: Assert public preview contains no episode or run data
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -E 'runs/|READY\.json|editorial-review|research\.json' dist; then
            echo "Internal run/research data leaked into Pages output" >&2
            exit 2
          fi
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
