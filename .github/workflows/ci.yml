name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Validate v2.1 fixture
        run: npm run validate -- fixtures/v2.1-demo.json
      - name: Validate and retention-review every episode manifest
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          manifests=(episodes/*/manifest.json)
          if [ ${#manifests[@]} -eq 0 ]; then
            echo "No episode manifests found"
            exit 0
          fi
          for manifest in "${manifests[@]}"; do
            echo "Validating $manifest"
            npm run validate -- "$manifest"
            kind=$(node -e 'const fs=require("node:fs");const p=process.argv[1];process.stdout.write(JSON.parse(fs.readFileSync(p,"utf8")).kind)' "$manifest")
            if [ "$kind" = "production" ]; then
              echo "Retention-reviewing $manifest"
              npm run review:retention -- "$manifest"
            fi
          done
      - name: Build browser preview
        run: npm run build
