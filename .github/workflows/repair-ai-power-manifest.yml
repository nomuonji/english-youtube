name: Repair AI power production manifest

on:
  push:
    branches: [main]
    paths:
      - "scripts/repair-ai-power-manifest.mjs"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Repair manifest
        run: node scripts/repair-ai-power-manifest.mjs
      - name: Commit repaired manifest
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add episodes/2026-09-15-ai-power-project/manifest.json
          git diff --cached --quiet && exit 0
          git commit -m "fix: satisfy production manifest schema"
          git push
