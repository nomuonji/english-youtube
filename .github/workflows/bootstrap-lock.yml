name: Bootstrap package lock

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/bootstrap-lock.yml"

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Generate lockfile only
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit generated lockfile
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- package-lock.json && git ls-files --error-unmatch package-lock.json >/dev/null 2>&1; then
            echo "package-lock.json already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: lock npm dependencies"
          git push origin HEAD:main
