name: One-off v7 Japanese visual polish

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/oneoff-v7-ja-polish.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Polish Japanese visual guidance
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/scenes/SceneRenderer.tsx')
          s=p.read_text()
          old='''        <div style={{fontSize:22,fontWeight:760,color:COLORS.text,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{topic}</div>'''
          new='''        <div style={{minWidth:0}}><div style={{fontSize:22,fontWeight:760,color:COLORS.text,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{topic}</div>{visualJa(topic)?<div style={{fontFamily:"'Noto Sans JP','Noto Sans CJK JP',sans-serif",fontSize:14,fontWeight:650,color:COLORS.muted,marginTop:2,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{visualJa(topic)}</div>:null}</div>'''
          if old not in s: raise SystemExit('topic block not found')
          s=s.replace(old,new)
          old2='''fontSize:large?23:18,color:COLORS.muted,fontWeight:650,marginTop:7'''
          new2='''fontSize:large?23:18,color:"currentColor",opacity:.68,fontWeight:650,marginTop:7'''
          if old2 not in s: raise SystemExit('visual label Japanese style not found')
          s=s.replace(old2,new2)
          p.write_text(s)
          PY
      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/scenes/SceneRenderer.tsx
          git diff --cached --quiet && exit 0
          git commit -m "ux: improve Japanese visual guidance contrast"
          git push origin HEAD:main
