name: One-off chapter navigation patch

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/oneoff-chapter-nav.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Replace scene-count rail with chapter rail
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/scenes/SceneRenderer.tsx')
          s=p.read_text()
          s=s.replace('const prettyCategory=(s:string)=>s.replaceAll("_"," ").toUpperCase();\n','')
          old='''const TopRail=({manifest,scene,resolved,frame}:{manifest:EpisodeManifest;scene:Scene;resolved:ResolvedScene;frame:number})=>{\n  const index=Math.max(0,manifest.scenes.findIndex(s=>s.id===scene.id));\n  const whole=clamp((index+frame/Math.max(1,resolved.durationFrames-1))/Math.max(1,manifest.scenes.length));\n  return <>\n    <div style={{position:"absolute",left:0,top:0,width:"100%",height:6,background:"rgba(16,42,54,.08)"}}><div style={{height:"100%",width:`${whole*100}%`,background:COLORS.accent}}/></div>\n    <div style={headerStyle}>\n      <div style={{display:"flex",alignItems:"center",gap:16}}>\n        <span style={{fontSize:18,fontWeight:850,color:COLORS.muted}}>{String(index+1).padStart(2,"0")} / {String(manifest.scenes.length).padStart(2,"0")}</span>\n        <span style={{fontWeight:850,color:COLORS.text}}>{sceneLabel(scene)}</span>\n      </div>\n      <div style={{fontSize:19,fontWeight:760,color:COLORS.muted}}>{prettyCategory(manifest.category)}</div>\n    </div>\n  </>;\n};'''
          new='''const chapterFor=(scene:Scene):{step:string;label:string}=>{\n  if(scene.role==="story"){\n    if(scene.beat==="setup")return {step:"1 / 4",label:"WHAT CHANGED"};\n    if(scene.beat==="mechanism")return {step:"2 / 4",label:"HOW IT WORKS"};\n    if(scene.beat==="complication")return {step:"3 / 4",label:"THE CATCH"};\n    return {step:"4 / 4",label:"WHAT IT MEANS"};\n  }\n  if(scene.role==="hook")return {step:"START",label:"THE QUESTION"};\n  if(scene.role==="phrase"||scene.role==="retrieval")return {step:"PAUSE",label:"PRACTICE"};\n  if(scene.role==="recap")return {step:"END",label:"TAKEAWAYS"};\n  return {step:"",label:sceneLabel(scene)};\n};\n\nconst TopRail=({manifest,scene,resolved,frame}:{manifest:EpisodeManifest;scene:Scene;resolved:ResolvedScene;frame:number})=>{\n  const index=Math.max(0,manifest.scenes.findIndex(s=>s.id===scene.id));\n  const whole=clamp((index+frame/Math.max(1,resolved.durationFrames-1))/Math.max(1,manifest.scenes.length));\n  const chapter=chapterFor(scene);\n  return <>\n    <div style={{position:"absolute",left:0,top:0,width:"100%",height:6,background:"rgba(16,42,54,.08)"}}><div style={{height:"100%",width:`${whole*100}%`,background:COLORS.accent}}/></div>\n    <div style={{...headerStyle,justifyContent:"flex-start"}}>\n      <div style={{display:"flex",alignItems:"center",gap:18}}>\n        <span style={{fontSize:18,fontWeight:900,color:COLORS.accent,letterSpacing:".04em"}}>{chapter.step}</span>\n        <span style={{fontSize:24,fontWeight:900,color:COLORS.text,letterSpacing:".02em"}}>{chapter.label}</span>\n      </div>\n    </div>\n  </>;\n};'''
          if old not in s:
              raise SystemExit('TopRail source block not found; refusing partial patch')
          p.write_text(s.replace(old,new))
          PY
      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/scenes/SceneRenderer.tsx
          git diff --cached --quiet && exit 0
          git commit -m "ux: orient viewer by four story chapters"
          git push origin HEAD:main
