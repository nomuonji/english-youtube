name: Edge TTS preview

on:
  push:
    branches: [main]
    paths:
      - "scripts/synthesize_edge.py"
      - "requirements-tts.txt"
      - "src/compiler/edgeTiming.ts"
      - "src/cli/compile-edge.ts"
      - "src/composition/**"
      - "src/scenes/**"
      - "fixtures/v2.1-demo.json"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/edge-tts-preview.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
      - name: Install Node dependencies
        run: npm ci --ignore-scripts
      - name: Install zero-key TTS adapter
        run: python3 -m pip install --disable-pip-version-check -r requirements-tts.txt
      - name: Validate fixture
        run: npm run validate -- fixtures/v2.1-demo.json
      - name: Synthesize scene speech and measured boundaries
        env:
          EDGE_TTS_VOICE: en-US-AriaNeural
          EDGE_TTS_RATE: -5%
        run: |
          mkdir -p public/generated out
          python3 scripts/synthesize_edge.py fixtures/v2.1-demo.json public/generated generated
      - name: Compile resolved timing
        run: npm run compile:edge -- fixtures/v2.1-demo.json public/generated/tts-timing.json public/generated/render-props.json
      - name: Render 540p preview
        run: npx remotion render src/composition/index.ts EpisodeVideo out/edge-preview.mp4 --props=public/generated/render-props.json --scale=0.5 --codec=h264 --crf=23
      - name: Upload preview artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: edge-tts-preview-${{ github.sha }}
          path: |
            out/edge-preview.mp4
            public/generated/tts-timing.json
            public/generated/render-props.json
          retention-days: 7
